version: 2
build:
  os: ubuntu-26.04
  tools:
    python: latest
  jobs:
    install:
      - pip install ".[docs]"
    build:
      html:
        - zensical build
    post_build:
      # Copy the built site into the directory Read the Docs publishes.
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
