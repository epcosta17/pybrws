[project]
name = "pybrws"
version = "0.1.0"
description = "A from-scratch browser-fingerprinted TLS client"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Everything the client itself needs beyond the standard library.
client = ["cryptography>=50", "hpack", "brotli"]
# Only for Python below 3.14, where zstd is not yet in the standard library.
zstd = ["zstandard"]
# Measurement and demo: httpx is the baseline every comparison runs against.
# aioquic is the QUIC transport and, in the tests, the oracle the Initial
# packet decryptor is checked against. pybrws.quic itself needs none of it:
# reading Initial packets takes only cryptography, because the keys come from
# a published salt.
dev = ["httpx[http2]", "jupyterlab", "nbclient", "aioquic", "curl_cffi"]
