[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pybrws"
version = "0.1.1"
description = "An HTTPS client that sends what Firefox 157 and Chrome 155 send over TLS and HTTP/2, and what Firefox 157 sends over HTTP/3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Everything a request needs. zstd is in the standard library from 3.14.
dependencies = [
    "cryptography>=50",
    "hpack",
    "brotli",
    "publicsuffixlist",
    "idna",
    "certifi",
    "zstandard; python_version < '3.14'",
]

[project.optional-dependencies]
# Empty: the packages they used to name are now dependencies. Kept so that
# `pip install "pybrws[client]"` and `pybrws[zstd]` keep working.
client = []
zstd = []
# HTTP/3 transport. pybrws.quic_impersonate patches aioquic's internals, so
# the range starts at the minor release requirements-lock.txt tests (1.3.0)
# and stops before the next major one.
http3 = ["aioquic>=1.3,<2"]
# The httpx baseline that `pybrws ab` compares against: the minor release
# requirements-lock.txt tests (0.28.1), and later ones below 1.0.
measure = ["httpx[http2]>=0.28,<1"]
# Building the documentation site.
docs = ["zensical>=0.1.1,<0.2", "mkdocstrings-python"]
# Running the test suite, with the same ranges. aioquic is also the oracle
# the Initial packet decryptor is checked against; pybrws.quic itself needs
# only cryptography.
dev = ["aioquic>=1.3,<2", "httpx[http2]>=0.28,<1"]

[project.scripts]
pybrws = "pybrws.cli:main"

[project.urls]
Homepage = "https://github.com/epcosta17/pybrws"
Documentation = "https://pybrws.readthedocs.io/"
Source = "https://github.com/epcosta17/pybrws"
Issues = "https://github.com/epcosta17/pybrws/issues"

# Setuptools would otherwise see two top-level directories, `pybrws` and
# `fixtures`, and refuse to guess which is the package, so the packages are
# listed explicitly.
[tool.setuptools]
packages = ["pybrws", "pybrws.profiles", "pybrws.data", "pybrws.tools"]

[tool.setuptools.package-data]
"pybrws.data" = ["*.hex", "*.json"]
